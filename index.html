<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Before / After Collage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F6F2; --ink:#211F1B; --sub:#7A776E;
    --before:#2A3EEA; --after:#E5384D; --line:#DEDACF;
    --danger:#B4483A; --card:#FFFFFF; --arrow:#E5384D;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#17160F; --ink:#F0EEE6; --sub:#9A968A;
      --before:#3B4CF0; --after:#F0475B; --line:#3A3729; --card:#221F17; --arrow:#F0475B;
    }
  }
  :root[data-theme="dark"]{
    --bg:#17160F; --ink:#F0EEE6; --sub:#9A968A;
    --before:#3B4CF0; --after:#F0475B; --line:#3A3729; --card:#221F17; --arrow:#F0475B;
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
  body{
    margin:0; min-height:100%; background:var(--bg); color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  header{
    padding:28px 20px 18px; max-width:760px; margin:0 auto;
  }
  h1{font-size:22px; font-weight:700; margin:0 0 4px; letter-spacing:-0.01em;}
  header p{margin:0; color:var(--sub); font-size:14px; line-height:1.5; max-width:52ch;}

  main{max-width:760px; margin:0 auto; padding:12px 20px 40px;}
  .pair{
    display:grid; grid-template-columns:1fr 1fr; gap:0;
    margin-bottom:22px; position:relative; border-radius:8px; overflow:hidden;
    box-shadow:0 0 0 1px var(--line);
  }
  .slot{
    aspect-ratio:3/4; background:var(--card); position:relative; overflow:hidden;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .slot img{width:100%; height:100%; object-fit:contain; background:var(--bg); display:block;}
  .slot .hint{
    color:var(--sub); font-size:12.5px; text-align:center; padding:0 14px; line-height:1.4;
  }
  .slot .hint svg{display:block; margin:0 auto 6px; opacity:.6;}
  .slot input[type=file]{display:none;}
  .arrow{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:34px; height:34px; z-index:3; filter:drop-shadow(0 1px 3px rgba(0,0,0,.35));
  }
  .footerbar{
    display:grid; grid-template-columns:1fr 1fr; max-width:760px; margin:0 auto 24px;
    padding:0 20px; gap:0; border-radius:8px; overflow:hidden;
  }
  .footerbar div{
    text-align:center; font-weight:700; font-size:17px; color:#fff; padding:12px 0;
  }
  .footerbar .b{background:var(--before);}
  .footerbar .a{background:var(--after);}
  .rowbar{
    grid-column:1/-1; display:flex; align-items:center; justify-content:space-between;
    margin-top:2px; margin-bottom:-2px;
  }
  .rowlabel{
    font-size:12px; color:var(--sub); background:transparent; border:none;
    border-bottom:1px solid transparent; padding:2px 0; width:60%;
    font-family:inherit; outline:none;
  }
  .rowlabel:focus{border-bottom-color:var(--line);}
  .rmrow{
    background:none; border:none; color:var(--sub); font-size:12px;
    cursor:pointer; padding:4px 6px;
  }
  .rmrow:hover{color:var(--danger);}

  .actions{
    max-width:760px; margin:0 auto; padding:0 20px 48px;
    display:flex; gap:10px; flex-wrap:wrap;
  }
  button.primary, button.ghost{
    font-family:inherit; font-size:14px; font-weight:600; padding:11px 18px;
    border-radius:6px; cursor:pointer; border:1.5px solid var(--ink);
  }
  button.primary{background:var(--ink); color:var(--bg);}
  button.primary:disabled{opacity:.4; cursor:not-allowed;}
  button.ghost{background:transparent; color:var(--ink);}
  button:focus-visible{outline:2px solid var(--after); outline-offset:2px;}

  .status{font-size:12.5px; color:var(--sub); margin-top:8px;}

  .sheet-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:20;
    display:none; align-items:flex-end; justify-content:center;
  }
  .sheet-backdrop.open{display:flex;}
  .sheet{
    background:var(--card); width:100%; max-width:760px;
    border-radius:14px 14px 0 0; padding:8px 16px calc(16px + env(safe-area-inset-bottom,0px));
  }
  .sheet h2{font-size:14px; font-weight:600; color:var(--sub); text-align:center; margin:8px 0 12px;}
  .sheet button{
    width:100%; text-align:left; background:none; border:none; border-top:1px solid var(--line);
    padding:15px 4px; font-family:inherit; font-size:15.5px; color:var(--ink);
    display:flex; align-items:center; gap:12px; cursor:pointer;
  }
  .sheet button svg{flex-shrink:0; opacity:.75;}
  .sheet .cancel{
    margin-top:8px; border-top:none; justify-content:center; font-weight:600; color:var(--danger);
  }
</style>
</head>
<body>

<header>
  <h1>Before / after collage</h1>
  <p>Add a photo pair per row. Every before photo lines up on the left, every after photo on the right — then download the stitched collage.</p>
</header>

<main id="rows"></main>
<div class="footerbar"><div class="b">Before</div><div class="a">After</div></div>

<div class="actions">
  <button class="ghost" id="addRow">+ Add pair</button>
  <button class="primary" id="download" disabled>Download collage</button>
</div>
<div class="status" id="status" style="max-width:760px;margin:0 auto;padding:0 20px 40px;"></div>

<div class="sheet-backdrop" id="sheetBackdrop">
  <div class="sheet">
    <h2>Add photo</h2>
    <button type="button" id="sheetGallery">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.5"/><path d="M21 16l-5-5-4 4-3-3-5 5"/></svg>
      Choose from gallery
    </button>
    <button type="button" id="sheetCamera">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 8h3l2-2h6l2 2h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      Take photo
    </button>
    <button type="button" class="cancel" id="sheetCancel">Cancel</button>
  </div>
</div>

<div class="sheet-backdrop" id="geoBackdrop">
  <div class="sheet">
    <h2>Add location to photo</h2>
    <div style="padding:0 4px 10px;">
      <div id="geoCoords" style="font-size:13px;color:var(--sub);margin-bottom:10px;line-height:1.4;"></div>
      <input id="localityInput" type="text" placeholder="Locality name (e.g. Pune, MH)"
        style="width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:6px;font-size:15px;font-family:inherit;background:var(--bg);color:var(--ink);">
    </div>
    <button type="button" id="geoConfirm" style="justify-content:center;font-weight:600;">Add to photo</button>
    <button type="button" class="cancel" id="geoSkip">Skip</button>
  </div>
</div>

<script>
const rowsEl = document.getElementById('rows');
const addBtn = document.getElementById('addRow');
const dlBtn = document.getElementById('download');
const statusEl = document.getElementById('status');
let rowId = 0;
const rows = []; // {id, label, beforeSrc, afterSrc}

function slotHint(word){
  return `<div class="hint"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.5"/><path d="M21 16l-5-5-4 4-3-3-5 5"/></svg>Tap to add ${word} photo</div>`;
}

function addRow(){
  const id = rowId++;
  rows.push({id, label:'', beforeSrc:null, afterSrc:null});
  render();
}

function removeRow(id){
  const idx = rows.findIndex(r=>r.id===id);
  if(idx>-1) rows.splice(idx,1);
  render();
}

function setLabel(id, val){
  const r = rows.find(r=>r.id===id);
  if(r) r.label = val;
}

function pickFile(id, side){
  pending = {id, side};
  sheetBackdrop.classList.add('open');
}

function openPicker(useCamera){
  if(!pending) return;
  const {id, side} = pending;
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  if(useCamera) input.capture = 'environment';
  input.onchange = e => {
    const f = e.target.files[0];
    if(!f) return;
    const reader = new FileReader();
    if(useCamera){
      reader.onload = async ev => {
        pendingStamp = {id, side, raw: ev.target.result, loc:null, address:null};
        statusEl.textContent = 'Getting location…';
        const loc = await getLocation();
        pendingStamp.loc = loc;
        localityInput.value = '';
        if(loc){
          geoCoords.textContent = `Lat ${loc.lat.toFixed(6)}, Long ${loc.lon.toFixed(6)} — detecting locality…`;
          geoBackdrop.classList.add('open');
          statusEl.textContent = '';
          const geo = await reverseGeocode(loc.lat, loc.lon);
          geoCoords.textContent = `Lat ${loc.lat.toFixed(6)}, Long ${loc.lon.toFixed(6)}`;
          if(geo && geo.title){
            localityInput.value = geo.title;
            pendingStamp.address = geo.address;
          } else {
            localityInput.placeholder = 'Locality name (auto-detect unavailable here — type it in)';
          }
        } else {
          geoCoords.textContent = "Location unavailable — you can still add a locality name.";
          geoBackdrop.classList.add('open');
          statusEl.textContent = '';
        }
      };
    } else {
      reader.onload = ev => {
        const r = rows.find(r=>r.id===id);
        if(!r) return;
        if(side==='before') r.beforeSrc = ev.target.result;
        else r.afterSrc = ev.target.result;
        render();
      };
    }
    reader.readAsDataURL(f);
  };
  input.click();
}

function loadImgAsync(src){
  return new Promise(res=>{ const im = new Image(); im.onload=()=>res(im); im.src=src; });
}

function getLocation(){
  return new Promise(resolve=>{
    if(!navigator.geolocation){ resolve(null); return; }
    navigator.geolocation.getCurrentPosition(
      pos => resolve({lat: pos.coords.latitude, lon: pos.coords.longitude}),
      () => resolve(null),
      {enableHighAccuracy:true, timeout:8000}
    );
  });
}

async function reverseGeocode(lat, lon){
  try{
    const controller = new AbortController();
    const t = setTimeout(()=>controller.abort(), 6000);
    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&zoom=14&addressdetails=1`, {signal: controller.signal, headers:{'Accept':'application/json'}});
    clearTimeout(t);
    if(!res.ok) return null;
    const data = await res.json();
    const a = data.address || {};
    const city = a.city || a.town || a.village || a.suburb || a.county;
    const title = [city, a.state, a.country].filter(Boolean).join(', ');
    return {title: title || null, address: data.display_name || null};
  }catch(e){
    return null;
  }
}

function wrapCanvasText(ctx, text, maxWidth, maxLines){
  if(!text) return [];
  const words = text.split(' ');
  const lines = [];
  let cur = '';
  for(const w of words){
    const test = cur ? cur + ' ' + w : w;
    if(ctx.measureText(test).width > maxWidth && cur){
      lines.push(cur);
      cur = w;
      if(lines.length === maxLines - 1) break;
    } else {
      cur = test;
    }
  }
  if(cur) lines.push(cur);
  if(lines.length === maxLines){
    let last = lines[maxLines-1];
    while(ctx.measureText(last + '…').width > maxWidth && last.length > 1){
      last = last.slice(0, -1);
    }
    lines[maxLines-1] = last + '…';
  }
  return lines;
}

function formatStampDate(d){
  const offsetMin = -d.getTimezoneOffset();
  const sign = offsetMin >= 0 ? '+' : '-';
  const abs = Math.abs(offsetMin);
  const oh = String(Math.floor(abs/60)).padStart(2,'0');
  const om = String(abs%60).padStart(2,'0');
  const datePart = d.toLocaleDateString('en-GB');
  const timePart = d.toLocaleTimeString('en-US', {hour:'2-digit', minute:'2-digit', hour12:true});
  return `${datePart}  ${timePart}  GMT ${sign}${oh}:${om}`;
}

async function stampImage(srcDataUrl, {lat, lon, title, address}){
  const img = await loadImgAsync(srcDataUrl);
  const canvas = document.createElement('canvas');
  canvas.width = img.width; canvas.height = img.height;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img,0,0);

  const W = img.width, H = img.height;
  const pad = Math.round(W*0.035);
  const titleSize = Math.max(20, Math.round(W*0.05));
  const subSize = Math.max(13, Math.round(W*0.023));
  const subGap = Math.round(subSize*1.5);
  const maxTextWidth = W - pad*2;

  const subLines = [];
  ctx.font = `400 ${subSize}px Inter, sans-serif`;
  if(address) subLines.push(...wrapCanvasText(ctx, address, maxTextWidth, 2));
  if(lat!=null && lon!=null) subLines.push(`Lat ${lat.toFixed(6)}°  Long ${lon.toFixed(6)}°`);
  subLines.push(formatStampDate(new Date()));

  const cardH = pad*1.4 + titleSize*1.05 + subGap*subLines.length;
  const cardY = H - cardH;
  const r = 18;

  ctx.fillStyle = 'rgba(53,53,51,0.88)';
  ctx.beginPath();
  ctx.moveTo(0, cardY);
  ctx.lineTo(W, cardY);
  ctx.lineTo(W, H);
  ctx.lineTo(0, H);
  ctx.lineTo(0, cardY+r);
  ctx.arcTo(0, cardY, r, cardY, r);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = '#fff';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  let ty = cardY + pad*0.85 + titleSize*0.78;
  ctx.font = `700 ${titleSize}px Inter, sans-serif`;
  ctx.fillText(title || 'Location', pad, ty, maxTextWidth);

  ctx.font = `400 ${subSize}px Inter, sans-serif`;
  subLines.forEach(line=>{
    ty += subGap;
    ctx.fillText(line, pad, ty);
  });

  return canvas.toDataURL('image/jpeg', 0.92);
}

const sheetBackdrop = document.getElementById('sheetBackdrop');
const geoBackdrop = document.getElementById('geoBackdrop');
const geoCoords = document.getElementById('geoCoords');
const localityInput = document.getElementById('localityInput');
let pending = null;
let pendingStamp = null;

document.getElementById('sheetGallery').addEventListener('click', ()=>{ sheetBackdrop.classList.remove('open'); openPicker(false); });
document.getElementById('sheetCamera').addEventListener('click', ()=>{ sheetBackdrop.classList.remove('open'); openPicker(true); });
document.getElementById('sheetCancel').addEventListener('click', ()=>{ sheetBackdrop.classList.remove('open'); pending = null; });
sheetBackdrop.addEventListener('click', e=>{ if(e.target===sheetBackdrop){ sheetBackdrop.classList.remove('open'); pending = null; } });

document.getElementById('geoConfirm').addEventListener('click', async ()=>{
  geoBackdrop.classList.remove('open');
  if(!pendingStamp) return;
  const {id, side, raw, loc, address} = pendingStamp;
  const title = localityInput.value.trim();
  let finalSrc = raw;
  try{
    finalSrc = await stampImage(raw, {lat: loc ? loc.lat : null, lon: loc ? loc.lon : null, title, address});
  }catch(e){}
  const r = rows.find(r=>r.id===id);
  if(r){ if(side==='before') r.beforeSrc = finalSrc; else r.afterSrc = finalSrc; render(); }
  pendingStamp = null; pending = null;
});
document.getElementById('geoSkip').addEventListener('click', async ()=>{
  geoBackdrop.classList.remove('open');
  if(!pendingStamp) return;
  const {id, side, raw, loc, address} = pendingStamp;
  let finalSrc = raw;
  try{
    finalSrc = await stampImage(raw, {lat: loc ? loc.lat : null, lon: loc ? loc.lon : null, title: '', address});
  }catch(e){}
  const r = rows.find(r=>r.id===id);
  if(r){ if(side==='before') r.beforeSrc = finalSrc; else r.afterSrc = finalSrc; render(); }
  pendingStamp = null; pending = null;
});

function render(){
  rowsEl.innerHTML = '';
  rows.forEach(r => {
    const pair = document.createElement('div');
    pair.className = 'pair';

    const bar = document.createElement('div');
    bar.className = 'rowbar';
    bar.innerHTML = `<input class="rowlabel" placeholder="Label this pair (optional)" value="${r.label.replace(/"/g,'&quot;')}"><button class="rmrow" type="button">Remove</button>`;
    bar.querySelector('.rowlabel').addEventListener('input', e=>setLabel(r.id, e.target.value));
    bar.querySelector('.rmrow').addEventListener('click', ()=>removeRow(r.id));
    pair.appendChild(bar);

    ['before','after'].forEach(side=>{
      const slot = document.createElement('div');
      const src = side==='before' ? r.beforeSrc : r.afterSrc;
      slot.className = 'slot ' + side + (src ? ' filled' : '');
      slot.innerHTML = src ? `<img src="${src}" alt="${side}">` : slotHint(side);
      slot.addEventListener('click', ()=>pickFile(r.id, side));
      pair.appendChild(slot);
    });

    const arrow = document.createElement('div');
    arrow.className = 'arrow';
    arrow.innerHTML = `<svg viewBox="0 0 24 24" width="34" height="34"><circle cx="12" cy="12" r="12" fill="var(--arrow)"/><path d="M9 7l6 5-6 5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    pair.appendChild(arrow);

    rowsEl.appendChild(pair);
  });

  const anyFilled = rows.some(r=>r.beforeSrc && r.afterSrc);
  dlBtn.disabled = !anyFilled;
}

addBtn.addEventListener('click', addRow);
addRow();

async function buildCanvas(){
  const complete = rows.filter(r=>r.beforeSrc && r.afterSrc);
  const cellW = 500, barH = 64, rowGap = 24, capH = 24;
  const loadImg = loadImgAsync;
  const pairs = await Promise.all(complete.map(async r => ({
    label: r.label, before: await loadImg(r.beforeSrc), after: await loadImg(r.afterSrc)
  })));
  const cellH = Math.round(cellW*4/3);
  const canvas = document.createElement('canvas');
  canvas.width = cellW*2;
  canvas.height = pairs.reduce((h,p)=> h + (p.label?capH:0) + cellH + rowGap, 0) - rowGap + barH;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#F7F6F2';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  let y = 0;
  pairs.forEach((p,i)=>{
    if(p.label){
      ctx.font = '600 15px Inter, sans-serif';
      ctx.fillStyle = '#7A776E';
      ctx.fillText(p.label, 4, y+16);
      y += capH;
    }
    drawCover(ctx, p.before, 0, y, cellW, cellH);
    drawCover(ctx, p.after, cellW, y, cellW, cellH);

    // arrow badge
    const cx = cellW, cy = y+cellH/2, r = 30;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2);
    ctx.fillStyle = '#E5384D'; ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(cx-8, cy-13); ctx.lineTo(cx+11, cy); ctx.lineTo(cx-8, cy+13);
    ctx.stroke();

    y += cellH;
    if(i < pairs.length-1) y += rowGap;
  });

  // single label bar at the very bottom
  ctx.fillStyle = '#2A3EEA';
  ctx.fillRect(0, y, cellW, barH);
  ctx.fillStyle = '#E5384D';
  ctx.fillRect(cellW, y, cellW, barH);
  ctx.font = '700 30px Inter, sans-serif';
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('Before', cellW/2, y+barH/2+2);
  ctx.fillText('After', cellW+cellW/2, y+barH/2+2);
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';

  return canvas;
}

function drawCover(ctx, img, x, y, w, h){
  ctx.fillStyle = '#F7F6F2';
  ctx.fillRect(x, y, w, h);
  const ir = img.width/img.height, tr = w/h;
  let dw=w, dh=h;
  if(ir>tr){ dh = w/ir; } else { dw = h*ir; }
  const dx = x + (w-dw)/2, dy = y + (h-dh)/2;
  ctx.drawImage(img, 0, 0, img.width, img.height, dx, dy, dw, dh);
}

async function downloadBlob(blob, filename){
  if(window.claude && typeof window.claude.use === 'function'){
    try{
      const dl = await window.claude.use('downloads');
      if(dl){
        const arrayBuf = await blob.arrayBuffer();
        await dl.save({filename, data:arrayBuf});
        return;
      }
    }catch(e){ /* fall through to standard browser download */ }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}

dlBtn.addEventListener('click', async ()=>{
  dlBtn.disabled = true;
  statusEl.textContent = 'Building collage…';
  try{
    const canvas = await buildCanvas();
    const blob = await new Promise(res=>canvas.toBlob(res, 'image/png'));
    await downloadBlob(blob, 'before-after-collage.png');
    statusEl.textContent = 'Collage ready — check your downloads.';
  } catch(err){
    statusEl.textContent = 'Something went wrong building the collage.';
  }
  dlBtn.disabled = false;
});
</script>
</body>
</html>
